name: PSP

on:
  push:
    branches:
      - psp-enhanced
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure CMake
        shell: bash
        run: >
          cmake -S. -Bbuild
          -DCMAKE_TOOLCHAIN_FILE=${PSPDEV}/psp/share/pspdev.cmake
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_PRX=1
          -DENC_PRX=1
          -DDEVILUTIONX_SYSTEM_LIBFMT=OFF

      - name: Build
        shell: bash
        run: cmake --build build -j 2

      - name: Package PSP release ZIP
        id: package
        shell: bash
        run: |
          test -f build/EBOOT.PBP
          test -d build/assets
          test -f build/assets/fonts/12-00.clx
          test -f build/assets/fonts/grayuis.trn

          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME%-psp}"
          else
            version="$GITHUB_REF_NAME"
          fi
          archive="devilutionx-psp-${version}.zip"

          cp Packaging/psp/README-PSP.txt build/README-PSP.txt
          cmake -E chdir build cmake -E tar cf "../${archive}" --format=zip EBOOT.PBP assets README-PSP.txt
          entries="$(cmake -E tar tf "$archive")"
          if grep -Fq '\' <<< "$entries"; then
            echo "ZIP contains backslash-separated paths" >&2
            exit 1
          fi
          if grep -Eiq '\.mpq/?$' <<< "$entries"; then
            echo "ZIP must not contain MPQ files" >&2
            exit 1
          fi
          grep -qx 'EBOOT.PBP' <<< "$entries"
          grep -qx 'assets/' <<< "$entries"
          grep -qx 'assets/fonts/12-00.clx' <<< "$entries"
          grep -qx 'assets/fonts/grayuis.trn' <<< "$entries"
          grep -qx 'README-PSP.txt' <<< "$entries"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Preserve PSP debug executable
        shell: bash
        run: |
          echo "=== PSP build executables ==="
          find build -type f \( -name "devilutionx" -o -name "*.elf" -o -name "*.map" \) -print

          debug_elf="$(find build -type f -name 'devilutionx' -print -quit)"
          if [ -z "$debug_elf" ]; then
            echo "ERROR: Could not find the PSP devilutionx ELF." >&2
            exit 1
          fi

          mkdir -p debug-artifacts
          cp "$debug_elf" debug-artifacts/devilutionx-debug.elf
          ls -lh debug-artifacts/devilutionx-debug.elf
          psp-readelf -S debug-artifacts/devilutionx-debug.elf | grep -E '\.symtab|\.debug_' || true

      - name: Upload PSP Build
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: devilutionx-psp-${{ github.ref_name }}
          path: build/

      - name: Upload PSP ZIP
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}

      - name: Upload PSP Debug ELF
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: devilutionx-psp-debug
          path: debug-artifacts/devilutionx-debug.elf
