name: Refresh PSP v1.6.0 documentation

on:
  push:
    branches:
      - upstream-psp
    paths:
      - .github/workflows/PSP-v1.6.0-docs-refresh.yml

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout corrected documentation
        uses: actions/checkout@v4

      - name: Download original PSP build 56
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37147919542 --repo "$GITHUB_REPOSITORY" --name devilutionx-psp --dir artifact

      - name: Repackage with corrected PSP instructions
        run: python3 Packaging/psp/package_release.py artifact devilutionx-psp-v1.6.0.zip

      - name: Refresh release ZIP and description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.6.0-psp devilutionx-psp-v1.6.0.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit v1.6.0-psp --notes-file Packaging/psp/RELEASE-NOTES-v1.6.0.md --repo "$GITHUB_REPOSITORY"
