name: Publish PSP v1.6.2

on:
  push:
    tags:
      - v1.6.2-psp

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release documentation
        uses: actions/checkout@v4

      - name: Verify PSP build source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 37880312834 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "d06db78e18db9aa4196d62f98cc680d664ac7d49"
          test "$(gh run view 37880312834 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = "success"

      - name: Download updated PSP build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37880312834 --repo "$GITHUB_REPOSITORY" --name devilutionx-psp --dir artifact

      - name: Package and verify PSP download
        run: python3 Packaging/psp/package_release.py artifact devilutionx-psp-v1.6.2.zip

      - name: Publish latest PSP release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create v1.6.2-psp devilutionx-psp-v1.6.2.zip
          --repo "$GITHUB_REPOSITORY"
          --title "DevilutionX PSP v1.6.2"
          --notes-file Packaging/psp/RELEASE-NOTES-v1.6.2.md
          --latest
          --verify-tag
