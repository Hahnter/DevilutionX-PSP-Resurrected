name: Build PSP EBOOT

on:
  workflow_dispatch:
  push:
    branches:
      - psp
    paths:
      - "Source/**"
      - "CMake/**"
      - "CMakeLists.txt"
      - "Packaging/**"
      - ".github/workflows/build-psp.yml"

permissions:
  contents: read

jobs:
  build-psp:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out PSP branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pull PSPDEV build environment
        run: docker pull ghcr.io/pspdev/pspdev:latest

      - name: Configure and build DevilutionX for PSP
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ghcr.io/pspdev/pspdev:latest \
            bash -c '
              set -euxo pipefail

              export PSPDEV=/usr/local/pspdev
              export PATH="$PSPDEV/bin:$PATH"

              echo "PSPDEV: $PSPDEV"
              command -v psp-cmake
              command -v psp-g++
              command -v cmake

              # GitHub owns the checked-out repository while the PSPDEV
              # container runs as a different user. Allow Git to inspect
              # the intentionally mounted repository.
              git config --global --add safe.directory /work

              echo "Git repository:"
              git status --short
              git describe --tags --always --dirty || true

              echo "Configuring DevilutionX PSP build..."

              psp-cmake -S . -B build-psp \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_PRX=OFF \
                -DENC_PRX=OFF \
                -DBUILD_ASSETS_MPQ=OFF

              echo "Building DevilutionX PSP..."

              cmake --build build-psp -j"$(nproc)"
            '

      - name: Verify PSP output
        run: |
          set -euxo pipefail

          test -f build-psp/EBOOT.PBP

          echo "EBOOT.PBP built successfully:"
          ls -lh build-psp/EBOOT.PBP

          if [ -d build-psp/assets ]; then
            echo "Matching assets directory found:"
            du -sh build-psp/assets
          else
            echo "::warning::build-psp/assets was not generated."
          fi

      - name: Prepare PSP test package
        run: |
          set -euxo pipefail

          mkdir -p artifact/DevilutionX

          cp build-psp/EBOOT.PBP artifact/DevilutionX/

          if [ -d build-psp/assets ]; then
            cp -a build-psp/assets artifact/DevilutionX/
          fi

          cat > artifact/DevilutionX/README-TEST.txt <<'EOF'
          DevilutionX PSP automated test build

          This package does NOT contain Diablo or Hellfire game data.

          Copy your own legitimate game data into this DevilutionX folder.

          Shareware:
            spawn.mpq

          Retail Diablo:
            DIABDAT.MPQ

          Keep EBOOT.PBP and the assets directory from this build together.

          PSP installation location:

            ms0:/PSP/GAME/DevilutionX/

          Shareware test sequence:

            1. Add spawn.mpq.
            2. Start DevilutionX.
            3. Reach the Diablo title screen.
            4. Press X.
            5. Confirm the shareware main menu loads.
            6. Select Single Player.
            7. Create a Warrior.
            8. Start a new game.
            9. Confirm town loads.
            10. Enter the Cathedral.
          EOF

          echo "Final artifact contents:"
          find artifact/DevilutionX -maxdepth 2 -type f -print

      - name: Upload PSP build
        uses: actions/upload-artifact@v4
        with:
          name: DevilutionX-PSP-${{ github.sha }}
          path: artifact/DevilutionX/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
